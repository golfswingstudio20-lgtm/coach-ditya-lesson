# Backup database Supabase mingguan (gratis, lewat GitHub Actions).
#
# Hasil: file terenkripsi "backup-YYYY-MM-DD.sql.gz.gpg" di tab Actions -> run -> Artifacts
# (disimpan 90 hari). Tidak memakai kuota Vercel; kuota Supabase hanya beberapa MB.
#
# Secrets yang wajib diisi di GitHub (Settings -> Secrets and variables -> Actions),
# nilainya SAMA dengan Environment Variables di Vercel:
#   DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#   BACKUP_PASSWORD  = kata sandi bebas untuk mengunci file backup (simpan baik-baik!)
#
# Membuka backup (di laptop, perlu GnuPG):
#   gpg -d backup-2026-10-12.sql.gz.gpg | gunzip > backup.sql
name: backup-database

on:
  schedule:
    - cron: '0 18 * * 0'   # setiap Minggu 18:00 UTC = Senin 01:00 WIB
  workflow_dispatch:        # tombol "Run workflow" untuk backup manual

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Cek secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Secrets DB_HOST / BACKUP_PASSWORD belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Pasang pg_dump (PostgreSQL 17)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Backup & enkripsi
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGDATABASE: ${{ secrets.DB_DATABASE }}
          PGUSER: ${{ secrets.DB_USERNAME }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -o pipefail
          PG=/usr/lib/postgresql/17/bin

          # Rapikan salah salin: spasi/baris baru, "https://", "postgresql://user@", ":port", "/path"
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          PGHOST=$(clean "$PGHOST"); PGPORT=$(clean "$PGPORT"); PGUSER=$(clean "$PGUSER"); PGDATABASE=$(clean "$PGDATABASE")
          PGHOST=${PGHOST#*://}; PGHOST=${PGHOST##*@}; PGHOST=${PGHOST%%/*}; PGHOST=${PGHOST%%:*}
          export PGHOST PGPORT PGUSER PGDATABASE

          # Cek bentuk DB_HOST tanpa menampilkan isinya
          if ! printf '%s' "$PGHOST" | grep -Eq '^([A-Za-z0-9-]+\.)+[A-Za-z0-9-]+$'; then
            echo "::error::DB_HOST tidak berbentuk alamat server (panjang ${#PGHOST} karakter). Isi yang benar contohnya: aws-0-ap-northeast-1.pooler.supabase.com (tanpa https://, tanpa spasi). Ambil dari Supabase > Connect > Session pooler."
            exit 1
          fi
          case "$PGHOST" in
            *pooler.supabase.com) echo "Host: Supabase pooler ✓" ;;
            *supabase.co) ;;
            *) echo "::warning::DB_HOST bukan alamat Supabase (bukan *.supabase.com / *.supabase.co). Pastikan yang disalin adalah DB_HOST." ;;
          esac

          # Supabase: alamat langsung db.xxx.supabase.co hanya IPv6 (GitHub tidak bisa menjangkau).
          case "$PGHOST" in
            db.*.supabase.co)
              echo "::error::DB_HOST memakai alamat langsung (db.xxx.supabase.co) yang tidak bisa dijangkau GitHub. Ganti secret DB_HOST dengan host 'Session pooler' dari Supabase > Connect (contoh: aws-0-ap-northeast-1.pooler.supabase.com) dan DB_USERNAME menjadi postgres.<project-ref>."
              exit 1 ;;
          esac

          # Pooler mode transaksi (6543) tidak cocok untuk pg_dump: pakai mode sesi (5432) di host yang sama.
          if [ "$PGPORT" = "6543" ]; then
            echo "::notice::DB_PORT 6543 (transaction pooler) diganti ke 5432 (session pooler) untuk backup."
            export PGPORT=5432
          fi
          [ -z "$PGPORT" ] && export PGPORT=5432
          [ -z "$PGDATABASE" ] && export PGDATABASE=postgres

          # Tes koneksi dulu supaya pesan error jelas
          if ! $PG/psql -tAc "select 'Terhubung ke PostgreSQL ' || current_setting('server_version')" 2> conn.err; then
            echo "::error::Tidak bisa terhubung ke database: $(tr '\n' ' ' < conn.err | cut -c1-400)"
            exit 1
          fi

          FILE="backup-$(TZ=Asia/Jakarta date +%Y-%m-%d).sql.gz"
          if ! $PG/pg_dump --schema=public --no-owner --no-privileges 2> dump.err | gzip -9 > "$FILE"; then
            echo "::error::pg_dump gagal: $(tr '\n' ' ' < dump.err | cut -c1-400)"
            exit 1
          fi
          SIZE=$(stat -c %s "$FILE")
          if [ "$SIZE" -lt 1000 ]; then echo "::error::Backup terlalu kecil ($SIZE byte), kemungkinan gagal."; exit 1; fi

          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSWORD" --symmetric --cipher-algo AES256 -o "$FILE.gpg" "$FILE"
          rm "$FILE"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"
          echo "### Backup selesai: $FILE.gpg ($(stat -c %s "$FILE.gpg") byte)" >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan backup (90 hari)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
